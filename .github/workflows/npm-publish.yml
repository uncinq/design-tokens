# https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publish Package to npmjs

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout the branch
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Publish
        run: npm publish --provenance

      - name: Trigger docs site rebuild
        env:
          NETLIFY_DOCS_BUILD_HOOK: ${{ secrets.NETLIFY_DOCS_BUILD_HOOK }}
        run: |
          # socle.uncinq.dev mounts this package's docs/ from node_modules and
          # refreshes it on every build, so a release only needs to ask Netlify
          # to rebuild. Never fail the publish over the documentation site:
          # the package is already on npm by this point.
          if [ -z "$NETLIFY_DOCS_BUILD_HOOK" ]; then
            echo "NETLIFY_DOCS_BUILD_HOOK is not set — skipping docs rebuild."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_DOCS_BUILD_HOOK" \
            && echo "Docs rebuild triggered." \
            || echo "Docs rebuild could not be triggered."

      - name: Notify Discord of Release
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.event.repository.name }}
          TITLE: ${{ github.event.release.name || github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          NOTES: ${{ github.event.release.body }}
        run: |
          payload=$(jq -n \
            --arg title "$REPO — $TITLE" \
            --arg url "$URL" \
            --arg desc "$NOTES" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: ($desc | if length > 4000 then .[0:3997] + "…" else . end),
                color: 5814783
              }]
            }')
          curl -sf -X POST -H "Content-Type: application/json" \
            -d "$payload" "$DISCORD_WEBHOOK_URL"